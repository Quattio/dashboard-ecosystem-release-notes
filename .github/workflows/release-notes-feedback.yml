name: Release notes — @claude feedback forwarder

# Forwards "@claude ..." comments on the release-notes staging PR to the
# "Quatt release notes generator" routine — i.e. the SAME configured agent that
# wrote the notes (its skill, staging->PR flow, GitHub/Jira/Slite access), not a
# generic context-less @claude. The routine applies the edit to the current
# staging entry, pushes to release-notes-staging, and replies in the PR.
#
# IMPORTANT: issue_comment / PR-review-comment workflows always run from the
# DEFAULT branch (main), so this only takes effect once merged to main.
#
# Requires repo secret CLAUDE_RELEASE_NOTES_TOKEN (the routine's API token) and
# repo variable CLAUDE_TRIGGER_API (the routine's trigger ID, "trig_..."), both
# under Settings → Secrets and variables → Actions — same values used in
# cic-yocto-builder. The token and trigger ID are a pair: both come from the
# same routine's trigger settings on claude.ai.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

jobs:
  forward:
    name: Forward @claude feedback to the routine
    runs-on: ubuntu-latest
    # Only act on @claude mentions, from write-access humans, never bots
    # (the public repo means anyone can comment — author_association gates it).
    if: >
      contains(github.event.comment.body, '@claude') &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - name: Confirm this is the release-notes staging PR
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const ev = context.eventName;
            let prNumber;
            if (ev === 'issue_comment') {
              if (!context.payload.issue.pull_request) { core.setOutput('skip', 'true'); return; }
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber,
            });
            // Only the staging->main release-notes PR qualifies.
            if (pr.state !== 'open' || pr.head.ref !== 'release-notes-staging' || pr.base.ref !== 'main') {
              core.setOutput('skip', 'true'); return;
            }
            core.setOutput('skip', 'false');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('pr_url', pr.html_url);

      - name: Fire the routine in feedback mode
        if: steps.pr.outputs.skip == 'false'
        env:
          TRIGGER_TOKEN: ${{ secrets.CLAUDE_RELEASE_NOTES_TOKEN }}
          TRIGGER_ID: ${{ vars.CLAUDE_TRIGGER_API }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          if [[ -z "${TRIGGER_TOKEN:-}" || -z "${TRIGGER_ID:-}" ]]; then
            echo "::warning::CLAUDE_RELEASE_NOTES_TOKEN secret or CLAUDE_TRIGGER_API variable not set — cannot forward feedback."
            exit 0
          fi

          # COMMENT is passed via env (never inlined into the script) to avoid
          # command injection from untrusted comment text.
          text="REVIEWER FEEDBACK MODE. ${COMMENTER} left a comment on the open release-notes staging PR #${PR_NUMBER} (${PR_URL}). Apply it as an edit to the CURRENT open staging entry: do NOT resolve a release tag, do NOT regenerate from scratch, do NOT change the target wave, do NOT reset staging, do NOT post to Slack. Push the fix to release-notes-staging and reply with a brief PR comment summarising what you changed. Feedback follows:

          ${COMMENT}"

          payload="$(jq -nc --arg t "$text" '{text: $t}')"

          curl -sS -f -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${TRIGGER_ID}/fire" \
            -H "Authorization: Bearer ${TRIGGER_TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d "$payload"

          echo "Forwarded @claude feedback from ${COMMENTER} on PR #${PR_NUMBER} to the release-notes routine."
